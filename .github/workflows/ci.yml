name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── STAGE 2: BUILD ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '**/target/*.jar'
          retention-days: 1

  # ── STAGE 3: STATIC ANALYSIS (SonarQube) ──────────────────────
  sonarqube:
    runs-on: self-hosted          # runs on local machine → reaches SonarQube at localhost:9090
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for SonarQube blame

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SonarQube Scan via Maven
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=exam-certification-platform \
            -Dsonar.projectName=Exam-Certification-Platform \
            -Dsonar.host.url=http://localhost:9090 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -DskipTests --no-transfer-progress

  # ── STAGE 4: TEST ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test --no-transfer-progress

      - name: Run Integration Tests (Testcontainers)
        run: mvn verify -Pintegration-tests --no-transfer-progress

      - name: OWASP Dependency Vulnerability Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'exam-certification-platform'
          path: '.'
          format: 'HTML'
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  # ── STAGE 5: ARTIFACT REPOSITORY (GHCR) ───────────────────────
  push-images:
    runs-on: ubuntu-latest
    needs: [test, sonarqube]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all service Docker images
        run: |
          TAG=${GITHUB_SHA::8}
          REPO="ghcr.io/${{ github.repository_owner }}/exam-platform"
          REPO=${REPO,,}
          SERVICES="auth-service enrollment-service payment-service exam-service grading-service certificate-service notification-service api-gateway"
          for svc in $SERVICES; do
            echo "Building $svc..."
            docker build -f "./$svc/Dockerfile" -t "$REPO/$svc:$TAG" -t "$REPO/$svc:latest" "."
            docker push "$REPO/$svc:$TAG"
            docker push "$REPO/$svc:latest"
            echo "Pushed $svc:$TAG"
          done

      - name: Trigger Jenkins CD Pipeline
        run: |
          curl -X POST "${{ secrets.JENKINS_URL }}/job/exam-platform-cd/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --data "IMAGE_TAG=${GITHUB_SHA::8}" \
            --data "COMMIT_SHA=${{ github.sha }}" \
            --data "TRIGGERED_BY=github-actions"
        continue-on-error: true
